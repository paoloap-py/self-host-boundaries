name: ci
on: [push, pull_request]
jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately installs NOTHING. Boundaries 2 and 3 need no serving endpoint,
      # and the openai package is absent here on purpose: before 2026-08-21 that
      # aborted the whole run at import time, taking down the two boundaries that
      # never touch it. If this job goes green with openai installed but red
      # without, the decoupling regressed.
      - name: boundary 3 against the committed fixtures, both directions
        run: python preflight.py --self-test
      - name: a run with no endpoint reports SKIP and exits 2, never 0
        run: |
          python preflight.py --metrics "file://$PWD/fixtures/metrics-healthy.txt"; rc=$?
          test $rc -eq 2 || { echo "expected exit 2 (checks skipped), got $rc"; exit 1; }
      - name: the broken-stack proxy fixture still fails
        run: |
          python preflight.py --metrics "file://$PWD/fixtures/metrics-proxy-dropped.txt"; rc=$?
          test $rc -eq 1 || { echo "expected exit 1 (boundary 3 fails), got $rc"; exit 1; }
      - name: preflight.py stays importable with no third-party packages
        run: python -c "import ast; ast.parse(open('preflight.py').read()); print('ok')"
