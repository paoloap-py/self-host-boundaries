# Every version here is chosen to break one boundary. See FIXES.md.
services:
  # BOUNDARY 2 is broken here: Triton 25.09 imports vllm.engine.metrics at backend
  # load, and 0.11.1 deleted that module. The container starts and the backend never
  # loads. Change to 0.11.0 to fix.
  triton:
    image: nvcr.io/nvidia/tritonserver:25.09-vllm-python-py3
    command: >
      bash -c "pip install vllm==0.11.1 &&
               tritonserver --model-repository=/models --metrics-port=8002"
    volumes: ["./model_repository:/models"]
    ports: ["8001:8001", "8002:8002"]
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/vllm-metrics
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # BOUNDARY 1 is broken here: this router accepts response_format and drops it.
  router:
    build: ./router
    ports: ["8000:8000"]
    environment:
      TRITON_URL: http://triton:8001
    depends_on: [triton]

  # BOUNDARY 3 is broken here: this scrapes Triton, which forwards 9 of vLLM's
  # 40-plus metrics and drops the two that would warn you. The merge proxy that
  # would carry them is not wired in.
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
